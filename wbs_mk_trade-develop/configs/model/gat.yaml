# ── GAT encoder config ────────────────────────────────────
encoder:
  name: "GAT"
  conv: "GATConv"
  hidden_channels: 128
  num_layers: 2
  heads: 4
  dropout: 0.3
  heterogeneous: true

decoder:
  # The previous dot product produced many saturated sigmoid scores near 1.0,
  # which destroyed useful ordering among top candidates.
  name: "mlp"
  mlp_hidden: 64

variational: false
